<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Message - AralMuna</title>
    <link rel="stylesheet" href="send-message.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>AralMuna</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="courses.html">Courses</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="message-section">
            <div class="container">
                <h2>Send Us A Message</h2>
                <p>If you have any questions or need assistance, feel free to reach out to us. We will get back to you as soon as possible!</p>
                <form action="submit-message.html" method="POST">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" required></textarea>

                    <button type="submit">Send Message</button>
                </form>
                <a href="contact.html" class="cta-button">Back to Contact</a>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 AralMuna | All Rights Reserved</p>
        </div>
    </footer>
</body>
</html>
