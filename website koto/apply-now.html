<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Now - AralMuna</title>
    <link rel="stylesheet" href="apply-now.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>AralMuna</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="courses.html">Courses</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="apply-section">
            <div class="container">
                <h2>Start Your Application</h2>
                <p>We are excited to have you apply to AralMuna! Please fill out the form below to begin the application process.</p>
                <form action="submit-application.html" method="POST">
                    <label for="full-name">Full Name:</label>
                    <input type="text" id="full-name" name="full-name" required>

                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="phone">Phone Number:</label>
                    <input type="text" id="phone" name="phone" required>

                    <label for="course">Course Interested In:</label>
                    <select id="course" name="course" required>
                        <option value="science">Science</option>
                        <option value="arts">Arts</option>
                        <option value="commerce">Commerce</option>
                    </select>

                    <label for="message">Why do you want to join AralMuna?</label>
                    <textarea id="message" name="message" required></textarea>

                    <a href="submit-application.html" type="submit">Submit Application</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 AralMuna | All Rights Reserved</p>
        </div>
    </footer>
</body>
</html>
